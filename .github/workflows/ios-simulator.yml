# Builds the iOS app (unsigned) for the iPhone Simulator, launches it and saves screenshots,
# so changes can be checked on iOS without a Mac. Needs no secrets.
#
# Runs on pull requests that touch the app, or from the Actions tab ("Run workflow").
# Screenshots are attached to the run as the "ios-simulator-screenshots" artifact.

name: iOS simulator check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-*.yml'

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # CRA treats lint warnings as errors when CI=true
      - run: npm run build
        env:
          CI: false

      - run: npx cap sync ios

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO
          echo "APP_PATH=$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app" >> "$GITHUB_ENV"

      - name: Check the sticker pack is embedded
        run: |
          appex="$APP_PATH/PlugIns/Stickers.appex"
          test -d "$appex" || { echo "::error::Stickers.appex missing from the app"; exit 1; }
          test -f "$appex/Assets.car" || { echo "::error::sticker asset catalog was not compiled"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$appex/Info.plist"
          echo "stickers compiled: $(xcrun assetutil --info "$appex/Assets.car" | grep -c '"RenditionName" : ".*\.png"')"

      - name: Run in simulator and take screenshots
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          print(next(d["udid"] for d in reversed(devs) if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$APP_PATH"
          xcrun simctl launch "$udid" au.com.indigemoji
          mkdir -p screenshots
          for t in 3 10 20; do
            sleep $(( t - ${prev:-0} )); prev=$t
            xcrun simctl io "$udid" screenshot "screenshots/after-${t}s.png"
          done
          xcrun simctl spawn "$udid" launchctl list | grep -q au.com.indigemoji \
            || { echo "::error::app is no longer running (crashed?)"; exit 1; }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator-screenshots
          path: screenshots/
          if-no-files-found: ignore
