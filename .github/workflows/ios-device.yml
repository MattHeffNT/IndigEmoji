# Builds an ad-hoc signed .ipa for installing directly on registered test iPhones (no App Store/TestFlight).
# The .ipa is attached to the run as the "indigemoji-adhoc-ipa" artifact. To install from Linux:
#   gh run download <run-id> -n indigemoji-adhoc-ipa && ideviceinstaller install App.ipa
#
# Runs on pushes to branches other than main that touch the app, or from the Actions tab.
# Uses the same secrets as ios-release.yml, plus two Ad Hoc profiles that include the test devices:
#   "Indigemoji Ad Hoc" (au.com.indigemoji) and "Indigemoji Stickers Ad Hoc" (au.com.indigemoji.Stickers)
# A newly registered device only works after both profiles are regenerated to include it.

name: iOS device build

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-device.yml'

concurrency:
  group: ios-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adhoc:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - run: |
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/App.xcarchive" >> "$GITHUB_ENV"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # CRA treats lint warnings as errors when CI=true
      - run: npm run build
        env:
          CI: false

      - run: npx cap sync ios

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      # the archive is signed with the App Store profiles (as set in the project), then re-signed ad hoc on export
      - name: Download provisioning profiles
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: au.com.indigemoji
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Download sticker pack provisioning profiles
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: au.com.indigemoji.Stickers
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export ad hoc .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>au.com.indigemoji</key><string>Indigemoji Ad Hoc</string>
              <key>au.com.indigemoji.Stickers</key><string>Indigemoji Stickers Ad Hoc</string>
            </dict>
            <key>compileBitcode</key><false/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -l "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v7
        with:
          name: indigemoji-adhoc-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
